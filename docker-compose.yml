version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: analysis_trend_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - analysis
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: analysis_trend_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-analysis_trend}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    expose:
      - "3306"
    # E2E 테스트 및 로컬 개발 편의용: DB 직접 접근 (admin role 부여 등)
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: analysis_trend_redis
    expose:
      - "6379"
    # 개발 편의용: 로컬에서 직접 접근이 필요하면 아래 주석 해제
    # ports:
    #   - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: analysis_trend_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-analysis_trend}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER:-user}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-password}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost
        - NEXT_PUBLIC_ANALYSIS_URL=http://localhost
        - NEXT_PUBLIC_USE_MOCK=false
    container_name: analysis_trend_frontend
    expose:
      - "3000"
    env_file:
      - ./frontend/.env.local
    networks:
      - app-network

  analysis:
    build: ./analysis
    container_name: analysis_trend_analysis
    expose:
      - "8000"
    environment:
      - REDIS_URL=redis://redis:6379
    env_file:
      - ./analysis/.env
    depends_on:
      redis:
        condition: service_started
    networks:
      - app-network

volumes:
  mysql-data:
  redis-data:

networks:
  app-network:
    driver: bridge
